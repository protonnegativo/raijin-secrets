name: Engine drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      trufflehog:
        description: trufflehog version to test (latest or vX.Y.Z)
        default: latest

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # trufflehog's go.mod has replace directives, so it is installed from its release, not go install.
      - name: Install trufflehog
        env:
          WANT: ${{ inputs.trufflehog || 'latest' }}
        run: |
          mkdir -p "$HOME/.local/bin"
          ver=""
          [ "$WANT" != latest ] && ver="v${WANT#v}"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$HOME/.local/bin" $ver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Installed versions
        id: versions
        run: |
          out=$(trufflehog --version 2>&1)
          echo "$out"
          installed=$(echo "$out" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          tested=$(python3 -c 'import json; print(json.load(open("engines.json"))["trufflehog"]["version"])')
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - run: pip install tiktoken
      # The fixtures are local fake secrets; trufflehog runs with --no-verification and --no-update.
      - name: Benchmark with the installed trufflehog
        id: bench
        env:
          LIVE: "1"
          PY: python3
        run: |
          set +e
          bench/run.sh "$RUNNER_TEMP/bench" > "$RUNNER_TEMP/bench.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/bench.log"
          grep -hE 'missing from output|MISSING|LEAKED|live run == replay' "$RUNNER_TEMP/bench.log" > "$RUNNER_TEMP/verify.txt" || true
          if grep -l '"engine_format"' "$RUNNER_TEMP"/bench/*/*.json >> "$RUNNER_TEMP/verify.txt"; then code=1; fi
          if grep -qE ' [1-9][0-9]* missing from output|MISSING' "$RUNNER_TEMP/verify.txt"; then code=1; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-trufflehog-${{ steps.versions.outputs.installed }}
          path: |
            ${{ runner.temp }}/bench
            ${{ runner.temp }}/bench.log
          retention-days: 14
      - name: Open or update the drift issue
        if: failure() && steps.bench.conclusion == 'failure'
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
        run: |
          gh label create engine-drift --color B60205 --description "An engine update broke the tool" 2>/dev/null || true
          { echo "The benchmark failed with trufflehog $INSTALLED."; echo; echo '```'; tail -n 40 "$RUNNER_TEMP/verify.txt"; echo '```'; echo; echo "Run: $RUN_URL"; } > "$RUNNER_TEMP/issue.md"
          n=$(gh issue list --label engine-drift --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Engine drift: trufflehog $INSTALLED" --label engine-drift --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Open or update the bump PR
        if: success()
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
          TESTED: ${{ steps.versions.outputs.tested }}
        run: |
          newer=$(python3 -c 'import sys; a, b = (tuple(map(int, v.split("."))) for v in sys.argv[1:3]); print(int(a > b))' "$INSTALLED" "$TESTED")
          [ "$newer" = 1 ] || { echo "trufflehog $INSTALLED is not newer than $TESTED"; exit 0; }
          branch="engine-bump/trufflehog-$INSTALLED"
          python3 - "$INSTALLED" <<'PY'
          import json, sys
          m = json.load(open("engines.json"))
          m["trufflehog"]["version"] = sys.argv[1]
          with open("engines.json", "w") as f:
              f.write("{\n" + ",\n".join(f'  {json.dumps(k)}: {json.dumps(v)}' for k, v in m.items()) + "\n}\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add engines.json
          git commit -m "Test with trufflehog $INSTALLED"
          git push -f origin "$branch"
          { echo "trufflehog $TESTED → $INSTALLED"; echo; echo "The benchmark passed with the new version (fixtures in the run's artifact, not committed):"; echo; echo '```'; cat "$RUNNER_TEMP/verify.txt"; echo '```'; echo; echo "Run: $RUN_URL"; } > "$RUNNER_TEMP/pr.md"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --head "$branch" --title "Test with trufflehog $INSTALLED" --body-file "$RUNNER_TEMP/pr.md"
          fi
