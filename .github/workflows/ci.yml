name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      # The benchmark runs trufflehog on local fake-secret fixtures, so it needs the tested trufflehog.
      # trufflehog's go.mod has replace directives, so it is installed from its release, not go install.
      - name: Install the tested trufflehog
        run: |
          v=$(python3 -c 'import json; print(json.load(open("engines.json"))["trufflehog"]["version"])')
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$HOME/.local/bin" "v$v"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pip install tiktoken
      # Offline: --no-verification and --no-update, nothing is verified or sent anywhere.
      - name: Benchmark
        env:
          PY: python3
        run: |
          bench/run.sh "$RUNNER_TEMP/bench" | tee "$RUNNER_TEMP/bench.log"
          if grep -E ' [1-9][0-9]* missing from output|MISSING' "$RUNNER_TEMP/bench.log"; then exit 1; fi
